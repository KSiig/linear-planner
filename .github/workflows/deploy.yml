name: Deploy to Cloudflare Pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require Linear client id
        env:
          VITE_LINEAR_CLIENT_ID: ${{ vars.VITE_LINEAR_CLIENT_ID }}
        run: test -n "$VITE_LINEAR_CLIENT_ID"
      - name: Build
        env:
          VITE_LINEAR_CLIENT_ID: ${{ vars.VITE_LINEAR_CLIENT_ID }}
        run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: "5b3269050c8afff008527d038d4f2538"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 pages deploy dist --project-name=linear-planner --branch=main
